[project]
name = "zeblaze-ble"
version = "0.1.0"
description = "BLE discovery, capture, and live reads for the Zeblaze Beyond 3 Pro"
requires-python = ">=3.10"
dependencies = ["bleak>=0.22"]

[project.scripts]
zeblaze-ble = "zeblaze_ble.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zeblaze_ble*"]
